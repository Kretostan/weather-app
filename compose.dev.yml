services:
  backend:
    build:
      context: ./backend
      target: dev
    command: yarn dev
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    env_file:
      - ./.env.development
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=${BACKEND_PORT:-3001}
    volumes:
      - ./backend:/app
      - /app/node_modules
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      disable: true

  frontend:
    build:
      context: ./frontend
      target: dev
    command: yarn dev --host 0.0.0.0 --port 5173
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    env_file:
      - ./.env.development
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
