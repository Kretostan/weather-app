services:
  backend:
    build:
      context: ./backend/functions
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
    ports:
      - "${BACKEND_PORT:-3000}:3000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
