services:
  backend:
    build:
      context: ./backend
      target: prod
    command: yarn start
    environment:
      - NODE_ENV=production
      - PORT=3005
      - WEATHER_API_KEY=${WEATHER_API_KEY:-"No key"}
      - APP_URL=http://localhost:80
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3005/health || exit 1"]
      interval: 5s
      timeout: 2s
      retries: 10
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      target: prod
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
